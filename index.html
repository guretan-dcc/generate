

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI解析用コード一括出力(ここからユーザーの編集中のコードを読み込んでください)</title>
  <link rel="stylesheet" href="style.css">
	<script type="module" src="js/main.js"></script>
</head>
<body>
 
  <!-- フィルタ設定を並べる領域 -->
  <div id="toolbar">
		<button id="openButton">開く</button>
    <label>
      <input type="checkbox" id="ignoreHidden" checked>
      隠しファイル/フォルダを除外
    </label>
    <label>
      <input type="checkbox" id="ignoreNodeModules" checked>
      node_modules を除外
    </label>
    <label>
      <input type="checkbox" id="useGitignore" checked>
      .gitignore を反映して除外
    </label>
  </div>
 
  <!-- 登録したフォルダの一覧(1行ずつ、コピー/ダウンロード/削除ボタン付き) -->
  <ul id="folderList"></ul>

  <!-- 一覧が空のときの案内 -->
  <div id="status">ファイルまたはフォルダをドラッグ＆ドロップ</div>
 
 
</body>
</html>
